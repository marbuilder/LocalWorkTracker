<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T06 — Chart Render & Tooltip</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; line-height: 1.45; background: #f4f6f8; color: #0f172a; }
    h1 { margin: 0 0 8px; }
    .summary { margin: 12px 0 16px; padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #d7dce2; }
    .pass { color: #0a7a3d; font-weight: 600; }
    .fail { color: #b00020; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; background: #fff; }
    td, th { border: 1px solid #d7dce2; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #eef2f6; font-size: 13px; }
    pre { background: #f4f6f8; padding: 8px 10px; border-radius: 6px; margin: 0; max-height: 240px; overflow: auto; font-size: 12px; }
    iframe { width: 1200px; max-width: 100%; height: 1000px; border: 1px solid #d7dce2; border-radius: 8px; margin-top: 16px; background: #fff; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid #c0c4cc; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>T06 — Chart Render & Tooltip</h1>
  <p>Legt zwei Einträge an und prüft, dass das Canvas nicht-trivial bemalt ist und der Hover-Tooltip auf einem Balken erscheint.</p>

  <div class="summary" id="status">Running…</div>
  <button id="rerunBtn" type="button">Neu ausführen</button>

  <table>
    <thead><tr><th style="width: 40%">Check</th><th style="width: 12%">Ergebnis</th><th>Details</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <h2>App im Iframe</h2>
  <iframe id="app" title="App"></iframe>

  <h2>Gefangene Exceptions</h2>
  <pre id="errors">(keine)</pre>

  <script>
    (() => {
      'use strict';
      const STORAGE_PREFIX = 'local-time-tracker-v1';
      let results = [], caughtErrors = [];
      const $ = id => document.getElementById(id);
      function record(name, pass, details) { results.push({ name, pass: !!pass, details: String(details ?? '') }); }
      function renderResults() {
        const tbody = $('results'); tbody.innerHTML = '';
        results.forEach(r => {
          const tr = document.createElement('tr');
          const safe = r.details.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
          tr.innerHTML = '<td>'+r.name+'</td><td class="'+(r.pass?'pass':'fail')+'">'+(r.pass?'PASS':'FAIL')+'</td><td><pre>'+safe+'</pre></td>';
          tbody.appendChild(tr);
        });
        const all = results.length && results.every(r => r.pass);
        const noResults = results.length === 0;
        $('status').innerHTML = noResults ? 'Running…' : (all ? '<span class="pass">Alle Checks bestanden.</span>' : '<span class="fail">Mindestens ein Check fehlgeschlagen.</span>');
        $('errors').textContent = caughtErrors.length ? caughtErrors.map(e => e.message + '\n' + (e.stack || '')).join('\n---\n') : '(keine)';
      }
      function waitRaf(n=2) { return new Promise(r => { let i=0; const t=()=>(++i>=n?r():requestAnimationFrame(t)); requestAnimationFrame(t); }); }
      function dispatchInput(el, val) { el.value = val; el.dispatchEvent(new Event('input', {bubbles:true})); el.dispatchEvent(new Event('change', {bubbles:true})); }
      function clearKeys() {
        const rm = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k === STORAGE_PREFIX || k.startsWith(STORAGE_PREFIX + '-'))) rm.push(k);
        }
        rm.forEach(k => localStorage.removeItem(k));
      }
      function hookErrors(win) {
        win.addEventListener('error', e => caughtErrors.push({ message: 'error: ' + e.message, stack: e.error?.stack || `${e.filename}:${e.lineno}:${e.colno}` }));
        win.addEventListener('unhandledrejection', e => { const r = e.reason; caughtErrors.push({ message: 'rejection: ' + (r?.message || String(r)), stack: r?.stack || '' }); });
      }
      function load(iframe) {
        return new Promise((res, rej) => {
          iframe.addEventListener('load', () => res(), { once: true });
          iframe.src = '../index.html?t=' + Date.now();
          setTimeout(() => rej(new Error('load timeout')), 5000);
        });
      }
      function pad2(n){return String(n).padStart(2,'0');}
      function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

      function addEntry(doc, ticket, dateStr, start, end) {
        dispatchInput(doc.getElementById('manualTicket'), ticket);
        dispatchInput(doc.getElementById('manualDate'), dateStr);
        dispatchInput(doc.getElementById('manualStart'), start);
        dispatchInput(doc.getElementById('manualEnd'), end);
        dispatchInput(doc.getElementById('manualPause'), '0');
        doc.getElementById('addManualBtn').click();
      }

      function canvasHasContent(canvas) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const data = ctx.getImageData(0, 0, w, h).data;
        // Sample 200 random pixels; not all zero alpha
        let nonEmpty = 0;
        for (let i = 0; i < 200; i++) {
          const idx = Math.floor(Math.random() * (data.length / 4)) * 4;
          if (data[idx + 3] > 0 && (data[idx] + data[idx+1] + data[idx+2]) > 10) nonEmpty++;
        }
        return nonEmpty;
      }

      async function run() {
        results = []; caughtErrors = []; renderResults();
        clearKeys();
        const iframe = $('app');
        try { await load(iframe); } catch (e) { record('iframe laedt', false, e.message); renderResults(); return; }
        const win = iframe.contentWindow, doc = iframe.contentDocument;
        hookErrors(win); await waitRaf(3);

        const today = new Date();
        addEntry(doc, 'T-A', isoDate(today), '09:00', '11:00'); await waitRaf(3);
        addEntry(doc, 'T-B', isoDate(today), '12:00', '12:30'); await waitRaf(3);

        const canvas = doc.getElementById('summaryChart');
        const subtitle = doc.getElementById('chartSubtitle');
        record('Chart-Subtitle zeigt Daten (nicht "Keine Daten")', !/Keine Daten/.test(subtitle.textContent), subtitle.textContent);
        const rect = canvas.getBoundingClientRect();
        record('Canvas-Element hat positive Breite und Höhe', rect.width > 100 && rect.height > 50, 'w=' + rect.width + ' h=' + rect.height);
        const filled = canvasHasContent(canvas);
        record('Canvas hat nicht-triviale Pixel (>5 von 200)', filled > 5, 'nonEmpty=' + filled);

        // Trigger mousemove on the canvas at an estimated bar position
        // Mit 2 Balken: ~72 + barWidth/2 in CSS-px. Wir nutzen relative Mitte des linken Drittels.
        const tooltip = doc.getElementById('chartTooltip');
        record('Tooltip-Element existiert', !!tooltip, tooltip ? tooltip.outerHTML.slice(0, 200) : 'fehlt');

        const cx = rect.left + 200;
        const cy = rect.top + rect.height / 2;
        const moveEvt = new win.MouseEvent('mousemove', { bubbles: true, clientX: cx, clientY: cy });
        canvas.dispatchEvent(moveEvt);
        await waitRaf(2);
        // Tooltip might not always trigger at this exact spot; do a sweep
        let tooltipShown = tooltip.classList.contains('show');
        if (!tooltipShown) {
          for (let x = 80; x < rect.width - 80; x += 25) {
            const evt = new win.MouseEvent('mousemove', { bubbles: true, clientX: rect.left + x, clientY: rect.top + rect.height * 0.6 });
            canvas.dispatchEvent(evt);
            await waitRaf(1);
            if (tooltip.classList.contains('show')) { tooltipShown = true; break; }
          }
        }
        record('Mousemove auf Bar → Tooltip wird angezeigt (.show)', tooltipShown, 'tooltip text=' + (tooltip.textContent || '').slice(0, 200));

        // Mouseleave hides tooltip
        canvas.dispatchEvent(new win.MouseEvent('mouseleave', { bubbles: true }));
        await waitRaf(2);
        record('Mouseleave → Tooltip verschwindet', !tooltip.classList.contains('show'), 'classes=' + tooltip.className);

        record('keine ungefangenen Exceptions', caughtErrors.length === 0, caughtErrors.map(e => e.message).join('\n') || 'keine');
        renderResults();
      }

      $('rerunBtn').addEventListener('click', run);
      run().catch(err => { caughtErrors.push({ message: 'runner: '+err.message, stack: err.stack }); renderResults(); });
    })();
  </script>
</body>
</html>
