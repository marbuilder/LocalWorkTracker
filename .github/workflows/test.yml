name: Headless tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx --yes playwright install --with-deps chromium

      - name: Run headless tests
        run: node tests/run-headless.mjs --port 8765
